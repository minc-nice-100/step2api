services:
  step2api:
    build: .
    image: step2api:latest
    container_name: step2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./accounts:/data
    environment:
      STEP_PANEL_PASSWORD: admin
      STEP_DEFAULT_MODE: playground
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8790/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
